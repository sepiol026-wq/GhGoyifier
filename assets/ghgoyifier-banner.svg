<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">GhGoyifier GitHub to Telegram gateway</title>
<desc id="desc">Animated GitHub event stream flowing through a secure gateway into Rich Telegram cards.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101b35"/></linearGradient>
 <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#49dcb1"/><stop offset="1" stop-color="#6c8cff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.pulse{animation:p 2.6s ease-in-out infinite}.flow{stroke-dasharray:18 18;animation:f 2s linear infinite}.card{animation:c 5s ease-in-out infinite}.card:nth-child(2){animation-delay:1.3s}.card:nth-child(3){animation-delay:2.6s}@keyframes p{50%{opacity:.45;transform:scale(1.08)}}@keyframes f{to{stroke-dashoffset:-72}}@keyframes c{0%,100%{transform:translateY(0);opacity:.8}50%{transform:translateY(-8px);opacity:1}}</style>
</defs>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/>
<circle cx="1160" cy="80" r="130" fill="#526dff" opacity=".12" class="pulse"/><circle cx="240" cy="350" r="160" fill="#38d6ab" opacity=".08" class="pulse"/>
<text x="80" y="118" fill="#f4f7ff" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800">GhGoyifier</text>
<text x="84" y="164" fill="#9eafd0" font-family="Inter,Arial,sans-serif" font-size="24">GitHub events, delivered as beautiful Rich Telegram cards</text>
<g transform="translate(90 225)"><rect width="150" height="92" rx="18" fill="#111f38" stroke="#314d76"/><path d="M48 66c-22-14-27-45-7-59 20-13 49-4 58 17 7 17 0 34-13 43-9 6-14-1-16-9-5 8-13 11-22 8Z" fill="none" stroke="#f4f7ff" stroke-width="7" stroke-linecap="round"/><text x="78" y="126" fill="#afbedb" text-anchor="middle" font-family="Inter,Arial" font-size="17">GitHub</text></g>
<path d="M255 270h165M520 270h165" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" class="flow" filter="url(#glow)"/>
<g transform="translate(420 225)"><rect width="100" height="92" rx="18" fill="#111f38" stroke="#49dcb1" stroke-width="2"/><path d="M26 30h48v34H45l-12 10v-10h-7Z" fill="none" stroke="#49dcb1" stroke-width="5" stroke-linejoin="round"/><circle cx="43" cy="47" r="3" fill="#49dcb1"/><circle cx="55" cy="47" r="3" fill="#49dcb1"/><circle cx="67" cy="47" r="3" fill="#49dcb1"/><text x="50" y="126" fill="#afbedb" text-anchor="middle" font-family="Inter,Arial" font-size="17">Gateway</text></g>
<g transform="translate(685 194)"><rect width="270" height="150" rx="20" fill="#f7f9ff"/><rect x="22" y="22" width="42" height="42" rx="12" fill="#526dff"/><path d="M34 33h18v17H39l-5 5Z" fill="none" stroke="#fff" stroke-width="3"/><rect x="82" y="27" width="152" height="9" rx="4" fill="#25334e" opacity=".8"/><rect x="82" y="48" width="112" height="8" rx="4" fill="#9aaaca"/><rect x="22" y="91" width="210" height="9" rx="4" fill="#d0d8e8"/><rect x="22" y="112" width="164" height="9" rx="4" fill="#d0d8e8"/><text x="135" y="184" fill="#afbedb" text-anchor="middle" font-family="Inter,Arial" font-size="17">Rich Message</text></g>
<g class="card" transform="translate(1010 86)"><rect width="280" height="72" rx="16" fill="#152544" stroke="#526dff"/><circle cx="30" cy="36" r="10" fill="#49dcb1"/><text x="55" y="32" fill="#f4f7ff" font-family="Inter,Arial" font-size="16" font-weight="700">push</text><text x="55" y="53" fill="#9eafd0" font-family="Inter,Arial" font-size="13">all commits reconciled</text></g>
<g class="card" transform="translate(1050 178)"><rect width="240" height="72" rx="16" fill="#152544" stroke="#49dcb1"/><circle cx="30" cy="36" r="10" fill="#6c8cff"/><text x="55" y="32" fill="#f4f7ff" font-family="Inter,Arial" font-size="16" font-weight="700">pull request</text><text x="55" y="53" fill="#9eafd0" font-family="Inter,Arial" font-size="13">one event-specific link</text></g>
<g class="card" transform="translate(1010 270)"><rect width="280" height="72" rx="16" fill="#152544" stroke="#526dff"/><circle cx="30" cy="36" r="10" fill="#49dcb1"/><text x="55" y="32" fill="#f4f7ff" font-family="Inter,Arial" font-size="16" font-weight="700">workflow</text><text x="55" y="53" fill="#9eafd0" font-family="Inter,Arial" font-size="13">clear status and context</text></g>
</svg>
